name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build
      - name: Push to Ready Branch
        run: |
          mkdir final_deploy
          # نسخ ملف الكود النهائي فقط
          cp plugins/custom-timestamps/dist/index.js final_deploy/index.js
          
          # إنشاء ملف تعريف نظيف ومضمون 100%
          cat << 'EOF' > final_deploy/manifest.json
          {
            "id": "custom-timestamps",
            "name": "Custom Timestamps",
            "description": "Change timestamp for all the messages the same as you want.",
            "author": "Adham",
            "version": "1.0.0",
            "dist.script": "index.js"
          }
          EOF
          
          cd final_deploy
          git init
          git config user.name "bot"
          git config user.email "bot@github.com"
          git checkout -b ready
          git add .
          git commit -m "Final absolute deploy"
          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ready
