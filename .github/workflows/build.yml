name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build
      - name: Force Find and Deploy
        run: |
          mkdir -p final_deploy
          BUILT_JS=$(find plugins/custom-timestamps -name "index.js" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -z "$BUILT_JS" ]; then
            echo "🚨 JS file not found! Check your index.ts"
            exit 1
          fi
          
          cp "$BUILT_JS" final_deploy/index.js
          
          cat << 'EOF' > final_deploy/manifest.json
          {
            "id": "custom-timestamps",
            "name": "Custom Timestamps",
            "description": "Modify message timestamps completely",
            "author": "Adham",
            "version": "1.0.0",
            "dist.script": "index.js"
          }
          EOF
          
          cd final_deploy
          git init
          git config user.name "bot"
          git config user.email "bot@github.com"
          git checkout -b ready
          git add .
          git commit -m "Deploy absolute JS path with English manifest"
          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ready
