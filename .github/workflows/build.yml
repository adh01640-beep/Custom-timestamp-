name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      
      - name: Build Plugins
        run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build

      - name: Deploy Built Plugin
        run: |
          mkdir -p /tmp/final_deploy
          
          # جلب المخرجات من مسار dist الحقيقي الذي تولده الأداة
          if [ -d "dist/custom-timestamps" ]; then
            cp -r dist/custom-timestamps/* /tmp/final_deploy/
          elif [ -d "dist" ]; then
            cp -r dist/* /tmp/final_deploy/
          fi
          
          # في حال وجود ملف manifest في plugins ولم يُنسخ
          if [ ! -f "/tmp/final_deploy/manifest.json" ] && [ -f "plugins/custom-timestamps/manifest.json" ]; then
            cp plugins/custom-timestamps/manifest.json /tmp/final_deploy/
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan final-plugin
          git rm -rf .
          cp -r /tmp/final_deploy/* .
          
          git add -A
          git commit -m "Deploy official built plugin"
          git push origin final-plugin -f
