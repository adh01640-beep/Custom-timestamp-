name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build
      - name: Deploy to Ready Branch
        run: |
          mkdir -p final_deploy
          
          # التقاط ملف الكود النهائي الناتج عن مجلد js
          BUILT_JS=$(find plugins/custom-timestamps -type f -path "*/dist/index.js" | head -n 1)
          cp "$BUILT_JS" final_deploy/index.js
          
          # إنشاء ملف تعريف نظيف ومضمون
          cat << 'EOF' > final_deploy/manifest.json
          {
            "id": "custom-timestamps",
            "name": "Custom Timestamps",
            "description": "تعديل شكل وقت الرسائل بالكامل",
            "author": "Adham",
            "version": "1.0.0",
            "dist.script": "index.js"
          }
          EOF
          
          cd final_deploy
          git init
          git config user.name "bot"
          git config user.email "bot@github.com"
          git checkout -b ready
          git add .
          git commit -m "Deploy from js/index.ts"
          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git ready
