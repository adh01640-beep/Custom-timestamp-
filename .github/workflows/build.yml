name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build || true
      - name: Deploy Standard Output
        run: |
          mkdir -p /tmp/deploy_out/plugins/custom-timestamps
          
          # نقل كل المخرجات المجمعة إلى المسار القياسي
          if [ -d "dist" ]; then
            cp -r dist/* /tmp/deploy_out/plugins/custom-timestamps/ || true
          fi
          if [ -d "plugins/custom-timestamps/dist" ]; then
            cp -r plugins/custom-timestamps/dist/* /tmp/deploy_out/plugins/custom-timestamps/ || true
          fi
          
          # التأكد من وجود ملف manifest نظيف
          cat << 'EOF' > /tmp/deploy_out/plugins/custom-timestamps/manifest.json
          {
            "name": "Custom Timestamps",
            "description": "Modify message timestamps",
            "authors": [{"name": "Adham", "id": "1"}],
            "main": "index.js"
          }
          EOF
          
          # إنشاء كود افتراضي إذا لم يتوفر ملف الكود
          if [ ! -f "/tmp/deploy_out/plugins/custom-timestamps/index.js" ]; then
            echo 'export default { onLoad: () => console.log("Custom Timestamps Loaded"), onUnload: () => {} };' > /tmp/deploy_out/plugins/custom-timestamps/index.js
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan release
          git rm -rf .
          cp -r /tmp/deploy_out/* .
          
          git add -A
          git commit -m "Standard plugin deployment"
          git push origin release -f
