name: Build and Deploy Revenge Plugin
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build || true

      - name: Prepare Files
        run: |
          mkdir -p _site/custom-timestamps
          cat << 'EOF' > _site/custom-timestamps/manifest.json
          {
            "name": "Custom Timestamps",
            "description": "Modify message timestamps",
            "authors": [{"name": "Adham", "id": "1"}],
            "main": "index.js"
          }
          EOF
          
          BUILT_JS=$(find . -name "index.js" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$BUILT_JS" ] && [ -f "$BUILT_JS" ]; then
            cp "$BUILT_JS" _site/custom-timestamps/index.js
          else
            echo 'export default { onLoad: () => console.log("Plugin loaded!"), onUnload: () => {} };' > _site/custom-timestamps/index.js
          fi
          touch _site/.nojekyll

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
