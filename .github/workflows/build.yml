name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      
      # 1. تجهيز الكود المصدري بالشكل الذي تطلبه الأداة الرسمية بدقة
      - name: Setup Valid Source
        run: |
          mkdir -p plugins/custom-timestamps/src
          cat << 'EOF' > plugins/custom-timestamps/manifest.json
          {
            "id": "custom-timestamps",
            "name": "Custom Timestamps",
            "description": "Modify message timestamps",
            "author": "Adham",
            "version": "1.0.0",
            "main": "index.js"
          }
          EOF
          cat << 'EOF' > plugins/custom-timestamps/src/index.ts
          export default {
            onLoad: () => console.log("Plugin loaded successfully!"),
            onUnload: () => console.log("Plugin unloaded!")
          };
          EOF

      # 2. البناء عبر الأداة الرسمية لتوليد ملفات JS مشفرة ومعتمدة لديسكورد
      - name: Build with Official CLI
        run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build

      # 3. عزل مجلد المخرجات الرسمي ورفعه كفرع مستقل نظيف
      - name: Deploy Built Plugin
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd plugins/custom-timestamps/dist
          git init
          git checkout -b final-plugin
          git add .
          git commit -m "Deploy official built plugin"
          git push -f https://${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git final-plugin
