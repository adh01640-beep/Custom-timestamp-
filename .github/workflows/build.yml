name: Build Revenge Plugins
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix Browserslist Error
        run: sed -i 's/"fully supports es6"/"defaults"/g' package.json || true
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Plugins
        run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build
      - name: Deploy to Build Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # إنشاء فرع نظيف ومستقل للبناء
          git checkout --orphan build
          git rm -rf . || true
          
          # جلب ملفات الـ Manifest ومجلدات البناء من الفرع الرئيسي
          git checkout main -- plugins/ || true
          if [ -d "dist" ]; then
            git checkout main -- dist/ || true
          fi
          
          git add -A
          git commit -m "🚀 Deploy plugins and manifests" || true
          git push origin build -f
