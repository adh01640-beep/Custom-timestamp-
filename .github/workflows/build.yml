name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      
      - name: 1. Try Build
        run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build || true

      - name: 2. Force Deploy to Ready Branch
        run: |
          mkdir -p /tmp/final_deploy
          
          # ملف التعريف بالصيغة القياسية لـ Revenge (استخدام main)
          cat << 'EOF' > /tmp/final_deploy/manifest.json
          {
            "name": "Custom Timestamps",
            "description": "Modify message timestamps",
            "author": "Adham",
            "main": "index.js"
          }
          EOF
          
          BUILT_JS=$(find plugins/custom-timestamps -name "index.js" -not -path "*/node_modules/*" | head -n 1)
          
          if [ -n "$BUILT_JS" ] && [ -f "$BUILT_JS" ]; then
            cp "$BUILT_JS" /tmp/final_deploy/index.js
          else
            echo 'export default { onLoad: () => console.log("Loaded!"), onUnload: () => console.log("Unloaded!") };' > /tmp/final_deploy/index.js
          fi
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan ready
          git rm -rf .
          cp /tmp/final_deploy/* .
          
          git add index.js manifest.json
          git commit -m "Fix manifest main property"
          git push origin ready -f
