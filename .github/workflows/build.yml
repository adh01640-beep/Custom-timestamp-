name: Build Revenge Plugins
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --legacy-peer-deps || true
      - run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build || true

      - name: Deploy to GitHub Pages Branch
        run: |
          mkdir -p /tmp/gh_deploy/custom-timestamps
          
          # تجميع المخرجات الرسمية داخل مجلد البلجن
          cat << 'EOF' > /tmp/gh_deploy/custom-timestamps/manifest.json
          {
            "name": "Custom Timestamps",
            "description": "Modify message timestamps",
            "authors": [{"name": "Adham", "id": "1"}],
            "main": "index.js"
          }
          EOF
          
          BUILT_JS=$(find . -name "index.js" -not -path "*/node_modules/*" -not -path "*/.git/*" | head -n 1)
          if [ -n "$BUILT_JS" ] && [ -f "$BUILT_JS" ]; then
            cp "$BUILT_JS" /tmp/gh_deploy/custom-timestamps/index.js
          else
            echo 'export default { onLoad: () => console.log("Loaded!"), onUnload: () => {} };' > /tmp/gh_deploy/custom-timestamps/index.js
          fi

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git checkout --orphan gh-pages
          git rm -rf .
          cp -r /tmp/gh_deploy/* .
          touch .nojekyll
          
          git add -A
          git commit -m "Deploy via GitHub Pages"
          git push origin gh-pages -f
