name: Build Revenge Plugins
on:
  push:
    branches: [ main, master ]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fix Browserslist
        run: sed -i 's/"fully supports es6"/"defaults"/g' package.json || true
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      - name: Build Plugins
        run: npx tsx node_modules/@revenge-mod/plugin-cli/src/main.ts build
      - name: Force Align Files
        run: |
          # تأكد من إنشاء مسار التوزيع ونسخ الـ manifest والـ js معاً
          mkdir -p plugins/custom-timestamps/dist
          if [ -f "dist/index.js" ]; then
            cp dist/index.js plugins/custom-timestamps/dist/index.js
          elif [ -f "index.js" ]; then
            cp index.js plugins/custom-timestamps/dist/index.js
          fi
          ls -la plugins/custom-timestamps/dist/
      - name: Deploy to Build Branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B build
          git add plugins/ -f
          git commit -m "🚀 Definitive fix: Force manifest and JS together" || true
          git push origin build -f
